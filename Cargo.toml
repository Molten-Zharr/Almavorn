[package]
name = "almavorn"
version = "0.2.0"
description = "A local music player with graphical and terminal interfaces"
license = "MIT"
repository = "https://github.com/Molten-Zharr/Almavorn"
edition = "2024"
publish = false
default-run = "almavorn"

[profile.dev]
# The GUI rasterizes fonts and converts pixels on the CPU, also during development.
opt-level = 1

[profile.release]
strip = "debuginfo"

[features]
default = ["guitui"]
guitui = ["dep:eframe", "dep:egui_ratatui", "dep:soft_ratatui", "dep:rustc-hash", "dep:wayland-client", "dep:raw-window-handle"]
tui = ["dep:crossterm", "ratatui/crossterm"]

[[bin]]
name = "almavorn"
path = "src/main.rs"
required-features = ["guitui"]

[[bin]]
name = "almavorn-tui"
path = "src/bin/tui.rs"
required-features = ["tui"]

[[example]]
name = "settings_preview"
required-features = ["guitui"]

[[example]]
name = "interface_preview"
required-features = ["guitui"]

[[example]]
name = "visualizer_preview"
required-features = ["guitui"]

[[example]]
name = "statistics_preview"
required-features = ["guitui"]

[dependencies]
ratatui = { version = "0.30.2", default-features = false, features = ["std", "unstable-rendered-line-info"] }
crossterm = { version = "0.29", optional = true }
eframe = { version = "~0.34.0", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"], optional = true }
egui_ratatui = { version = "2.2.0", optional = true }
soft_ratatui = { version = "~0.2.0", default-features = false, features = ["embedded-ttf"], optional = true }
rustc-hash = { version = "2.1", optional = true }
anyhow = "1"
tokio = { version = "1.53.2", features = ["rt-multi-thread", "sync", "time", "macros"] }
dirs = "6"
lofty = "0.25.4"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "gif"] }
rodio = { version = "0.22.2", default-features = false, features = ["playback", "symphonia-all"] }
rusqlite = { version = "0.40.2", default-features = false, features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
fastrand = "2"
soundtouch = { version = "0.5.4", default-features = false, features = ["bundled"] }
tempfile = "3"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
scraper = { version = "0.29", default-features = false }
keyring = { version = "3.6", default-features = false, features = ["async-secret-service", "tokio", "crypto-rust"] }
zip = { version = "4", default-features = false, features = ["deflate"] }
sha2 = "0.10"
base64 = "0.22"
getrandom = "0.3"
rhai = { version = "1.27", features = ["serde", "sync"] }

[target.'cfg(target_os = "linux")'.dependencies]
wayland-client = { version = "0.31.15", features = ["system", "dlopen"], optional = true }
raw-window-handle = { version = "0.6.2", optional = true }
zbus = { version = "5", default-features = false, features = ["tokio"] }
url = "2"
