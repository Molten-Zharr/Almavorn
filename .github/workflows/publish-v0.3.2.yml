name: Publish 0.3.2

on:
  push:
    branches: ["main"]
    paths: [".github/workflows/publish-v0.3.2.yml"]
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: publish-v0.3.2
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: 768000c92f26ce3c1b3069707f33a771fb48f78d
          fetch-depth: 0
          persist-credentials: false
      - name: Verify the existing tag and successful build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json, subprocess
          source = '768000c92f26ce3c1b3069707f33a771fb48f78d'
          tag = subprocess.check_output(['git', 'rev-parse', 'refs/tags/v0.3.2'], text=True).strip()
          if tag != '7e5fe9f34cfb0c947ef8552b4019c76d74412a89':
              raise SystemExit('The existing v0.3.2 tag has changed')
          run = json.loads(subprocess.check_output([
              'gh', 'api', 'repos/{owner}/{repo}/actions/runs/43010857613'
          ]))
          if run['head_sha'] != source or run['status'] != 'completed' or run['conclusion'] != 'success':
              raise SystemExit('The source build must have completed successfully')
          # The player and release description match the tag. Only the packaging
          # tool pin differs; the already published tag must never be moved.
          subprocess.run(['git', 'diff', '--exit-code', 'v0.3.2', source, '--', '.',
                          ':(exclude).github/workflows/release.yml'], check=True)
          PY
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          github-token: ${{ github.token }}
          run-id: 43010857613
          artifact-ids: 13851206078,13849814925
          path: target/release-assets
          merge-multiple: true
      - name: Publish verified packages to the existing v0.3.2 tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import hashlib, json, os, pathlib, re, subprocess
          import urllib.request, urllib.parse, urllib.error
          def fail(message):
              escaped = str(message).replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
              print('::error::' + escaped, flush=True)
              raise SystemExit(1)
          def command(args):
              result = subprocess.run(args, capture_output=True, text=True)
              if result.returncode:
                  fail(result.stderr or result.stdout or f'Command failed: {args}')
              return result.stdout
          tag, version = 'v0.3.2', '0.3.2'
          directory = pathlib.Path('target/release-assets')
          expected = {f'almavorn-{version}-{variant}-linux-x86_64.{extension}'
                      for variant in ('guitui', 'tui')
                      for extension in ('tar.gz', 'AppImage', 'flatpak')}
          def artifact(name):
              matches = list(directory.rglob(name))
              if len(matches) != 1 or not matches[0].is_file():
                  fail(f'Release requires exactly one {name}')
              return matches[0]
          hashes = {}
          for variant in ('guitui', 'tui'):
              for line in artifact(f'SHA256SUMS-{variant}').read_text().splitlines():
                  checksum, name = line.split(maxsplit=1)
                  if name not in expected or name in hashes or not re.fullmatch(r'[0-9a-f]{64}', checksum):
                      fail('Invalid package checksum manifest')
                  hashes[name] = checksum
          if set(hashes) != expected:
              fail('The release needs all six packages')
          for name, expected_hash in hashes.items():
              digest = hashlib.sha256()
              with artifact(name).open('rb') as stream:
                  for chunk in iter(lambda: stream.read(1024 * 1024), b''):
                      digest.update(chunk)
              if digest.hexdigest() != expected_hash:
                  fail(f'Checksum mismatch: {name}')
          checksums = directory / 'SHA256SUMS'
          checksums.write_text(''.join(f'{hashes[name]}  {name}\n' for name in sorted(hashes)))
          hashes['SHA256SUMS'] = hashlib.sha256(checksums.read_bytes()).hexdigest()
          endpoint = 'repos/{owner}/{repo}/releases'
          def matching_releases():
              pages = json.loads(command(['gh', 'api', endpoint + '?per_page=100', '--paginate', '--slurp']))
              return [item for page in pages for item in page if item['tag_name'] == tag]
          releases = matching_releases()
          if not releases:
              command(['gh', 'release', 'create', tag, '--verify-tag', '--draft',
                       '--title', f'Almavorn {version}', '--notes-file', f'releases/{tag}.md'])
              releases = matching_releases()
          if not releases:
              fail('The created release is not visible in the authenticated release list')
          release = next((item for item in releases if not item['draft']), releases[0])
          print(f"Selected release {release['id']}; matching releases: {len(releases)}", flush=True)
          upload_url = release['upload_url'].split('{', 1)[0]
          parsed = urllib.parse.urlsplit(upload_url)
          if parsed.scheme != 'https' or parsed.hostname != 'uploads.github.com':
              fail('Unexpected GitHub asset upload URL')
          remote = {item['name']: item for item in release['assets']}
          if set(remote) - set(hashes):
              fail('The release contains unexpected assets; preserving them')
          for name, checksum in hashes.items():
              if name in remote:
                  if remote[name].get('digest') != 'sha256:' + checksum:
                      fail(f'Existing asset differs: {name}; preserving it')
              elif release['draft']:
                  path = artifact(name)
                  with path.open('rb') as stream:
                      request = urllib.request.Request(upload_url + '?' + urllib.parse.urlencode({'name': name}),
                          data=stream, method='POST', headers={
                              'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                              'Content-Type': 'application/octet-stream',
                              'Content-Length': str(path.stat().st_size),
                              'User-Agent': 'Almavorn-release',
                          })
                      try:
                          with urllib.request.urlopen(request, timeout=120) as response:
                              json.load(response)
                      except urllib.error.HTTPError as error:
                          fail(f'Upload {name}: HTTP {error.code}')
              else:
                  fail(f'Published release is missing {name}; preserving it')
          if release['draft']:
              command(['gh', 'api', endpoint + '/' + str(release['id']),
                       '--method', 'PATCH', '-F', 'draft=false', '-f', 'make_latest=true'])
          PY
