name: Release

on:
  push:
    tags: ["v*"]
    branches: ["main", "release/*"]
    paths: ["releases/*.md", ".github/workflows/release.yml", "scripts/*", "packaging/*", "install.sh"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        variant: [guitui, tui]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libclang-dev libasound2-dev libxkbcommon-dev libxkbcommon-x11-0 libwayland-dev libgl1-mesa-dev libxcursor1 libxrandr2 libxi6 libxinerama1 flatpak zstd
          rustup toolchain install stable --profile minimal
          rustup default stable
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak install --user --noninteractive flathub org.freedesktop.Platform//25.08 org.freedesktop.Sdk//25.08
      - name: Download packaging tools
        run: |
          mkdir -p target/packaging-tools
          curl -fL --retry 3 https://github.com/linuxdeploy/linuxdeploy/releases/download/1-alpha-20251107-1/linuxdeploy-x86_64.AppImage -o target/packaging-tools/linuxdeploy.AppImage
          curl -fL --retry 3 https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage -o target/packaging-tools/appimagetool.AppImage
          echo 'c20cd71e3a4e3b80c3483cef793cda3f4e990aca14014d23c544ca3ce1270b4d  target/packaging-tools/linuxdeploy.AppImage' | sha256sum -c
          echo '95cbe7cce9717fce90c484e34052ee7c7f1d7635b33c12525b4776826a7d29b6  target/packaging-tools/appimagetool.AppImage' | sha256sum -c
          chmod +x target/packaging-tools/*.AppImage
      - name: Build tar.gz, AppImage and Flatpak
        run: >-
          python3 scripts/package-release.py --variant ${{ matrix.variant }} --format all
          --linuxdeploy target/packaging-tools/linuxdeploy.AppImage
          --appimagetool target/packaging-tools/appimagetool.AppImage
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: linux-${{ matrix.variant }}
          path: target/dist/*/${{ matrix.variant }}/*
          if-no-files-found: error
          compression-level: 0
  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: linux
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: linux-*
          path: target/release-assets
          merge-multiple: true
      - name: Upload and publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json, os, pathlib, subprocess
          version = json.loads(subprocess.check_output([
              'cargo', 'read-manifest', '--manifest-path', 'Cargo.toml'
          ]))['version']
          tag = os.environ['GITHUB_REF_NAME']
          if tag != f'v{version}':
              raise SystemExit('Tag and Cargo.toml version differ')
          directory = pathlib.Path('target/release-assets')
          expected = {f'almavorn-{version}-{variant}-linux-x86_64.{extension}'
                      for variant in ('guitui', 'tui')
                      for extension in ('tar.gz', 'AppImage', 'flatpak')}
          def artifact(name):
              matches = list(directory.rglob(name))
              if len(matches) != 1 or not matches[0].is_file():
                  raise SystemExit(f'Release requires exactly one {name}')
              return matches[0]
          assets = [artifact(name) for name in sorted(expected)]
          checksums = directory / 'SHA256SUMS'
          checksums.write_text(''.join(artifact(f'SHA256SUMS-{variant}').read_text()
                                      for variant in ('guitui', 'tui')))
          assets.append(checksums)
          subprocess.run([
              'gh', 'release', 'create', tag, '--verify-tag', '--draft',
              '--title', f'Almavorn {version}', '--notes-file', f'releases/v{version}.md',
              *map(str, assets)
          ], check=True)
          subprocess.run([
              'gh', 'release', 'edit', tag, '--draft=false'
          ], check=True)
          PY
  release-notes:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Update release descriptions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json, pathlib, re, subprocess
          releases = json.loads(subprocess.check_output([
              'gh', 'release', 'list', '--limit', '100', '--json', 'tagName'
          ]))
          for release in releases:
              tag = release['tagName']
              if not re.fullmatch(r'v[0-9]+\.[0-9]+\.[0-9]+', tag):
                  continue
              notes = pathlib.Path('releases') / f'{tag}.md'
              if notes.is_file():
                  subprocess.run([
                      'gh', 'release', 'edit', tag, '--notes-file', str(notes)
                  ], check=True)
          PY
      - name: Remove standalone icon downloads from v0.2.0
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import hashlib, json, pathlib, re, subprocess
          tag = 'v0.2.0'
          release = json.loads(subprocess.check_output([
              'gh', 'api', 'repos/{owner}/{repo}/releases/tags/' + tag
          ]))
          assets = {asset['name']: asset for asset in release['assets']}
          expected = {f'almavorn-0.2.0-{variant}-linux-x86_64.{extension}'
                      for variant in ('guitui', 'tui')
                      for extension in ('tar.gz', 'AppImage', 'flatpak')}
          lines = []
          for name in sorted(expected):
              digest = assets.get(name, {}).get('digest', '')
              if not re.fullmatch(r'sha256:[0-9a-f]{64}', digest):
                  raise SystemExit(f'Missing release checksum: {name}')
              lines.append(f'{digest[7:]}  {name}\n')
          content = ''.join(lines).encode()
          checksum_digest = 'sha256:' + hashlib.sha256(content).hexdigest()
          if assets.get('SHA256SUMS', {}).get('digest') != checksum_digest:
              directory = pathlib.Path('target/release-metadata')
              directory.mkdir(parents=True, exist_ok=True)
              checksums = directory / 'SHA256SUMS'
              checksums.write_bytes(content)
              subprocess.run(['gh', 'release', 'upload', tag, str(checksums), '--clobber'], check=True)
          for name in ('almavorn-0.2.0-icons-dark.zip', 'almavorn-0.2.0-icons-light.zip'):
              if name in assets:
                  subprocess.run(['gh', 'release', 'delete-asset', tag, name, '--yes'], check=True)
          PY
